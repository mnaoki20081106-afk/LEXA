# XcodeGen project spec. This repo does not contain a checked-in .xcodeproj
# (it's a generated, machine-specific artifact -- see ios/README.md for why).
#
# On a Mac:
#   brew install xcodegen
#   cd ios/LEXA
#   xcodegen generate
#   open LEXA.xcodeproj
name: LEXA
options:
  bundleIdPrefix: com.lexa.app  # PLACEHOLDER — not specified anywhere in the
                                 # attached specs. Change before archiving/
                                 # submitting to the App Store.
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.10"
targets:
  LEXA:
    type: application
    platform: iOS
    sources:
      - path: Sources/LEXA
      - path: Resources
    info:
      path: Sources/LEXA/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LEXA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexa.app.LEXA
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only for now (project_overview.txt §1: "iPhoneを中心に開発")
        SWIFT_STRICT_CONCURRENCY: complete
